[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stage-lr"
version = "0.1.0"
description = "StageLR — Multi-stage LR scheduler (linear, cosine, constant, REX) with warmup for PyTorch"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "diffusion-pipe", email = "nruaif@gmail.com" }]
requires-python = ">=3.8"
dependencies = ["torch>=1.9"]
keywords = ["pytorch", "lr-scheduler", "rex", "stage-lr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: PyTorch",
]

[project.urls]
Homepage = "https://github.com/nruaif/diffusion-pipe-mageflow-ft"
Repository = "https://github.com/nruaif/diffusion-pipe-mageflow-ft"

[tool.setuptools.packages.find]
where = ["."]
include = ["stage_lr*"]

[project.optional-dependencies]
dev = ["matplotlib", "pytest"]
