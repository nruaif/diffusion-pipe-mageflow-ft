# StageLR example — multi-stage LR with warmup, compatible with train.py
# Enable via: lr_scheduler = "StageLR"  (or "stage") + [StageLR] table
# Also supports: lr_scheduler = {type="stage", stages=[...]}  or  [lr_scheduler] type="stage"

output_dir = "/tmp/stage-lr-test"
dataset = "examples/mage_flow_dataset.toml"
epochs = 10
micro_batch_size_per_gpu = 2
gradient_accumulation_steps = 2
pipeline_stages = 1
warmup_steps = 0  # top-level warmup is ignored when StageLR has its own
save_every_n_epochs = 5
activation_checkpointing = true
caching_batch_size = 1

[model]
type = "mage_flow"
diffusers_path = "/path/to/Mage-Flow"
dtype = "bfloat16"

# Tell train.py to use StageLR — reads [StageLR] table below
lr_scheduler = "StageLR"

[StageLR]
warmup_steps = 100
# total_iters optional — defaults to epochs * steps_per_epoch if omitted
# total_iters = 5000
stages = [
    { type = "linear",   end_lr = 1e-4, percent = 0.1 },   # 10% linear warmup to 1e-4 (after warmup_steps)
    { type = "cosine",   end_lr = 5e-5, percent = 0.3 },   # 30% cosine decay
    { type = "rex",      max_val = 1e-4, min_val = 1e-5, percent = 0.3 }, # 30% REX
    { type = "constant", lr = 1e-5,      percent = 0.3 },  # 30% constant
]

[optimizer]
type = "adamw"
lr = 5e-5  # base lr — StageLR interpolates from this
betas = [0.9, 0.99]
weight_decay = 0.01

# Legacy constant/linear still work (backward compat):
# lr_scheduler = "constant"  # or "linear"
# warmup_steps = 100
